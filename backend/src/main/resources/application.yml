spring:
  application:
    name: wastecollect-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wastecollect}
    username: ${DATABASE_USERNAME:wastecollect}
    password: ${DATABASE_PASSWORD:change-me-for-local-use}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
server:
  port: ${BACKEND_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  grouping:
    max-requests: ${GROUPING_MAX_REQUESTS:50}
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${APP_BOOTSTRAP_ADMIN_NAME:Local Administrator}
