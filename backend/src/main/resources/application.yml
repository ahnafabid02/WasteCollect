spring:
  application:
    name: wastecollect-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wastecollect}
    username: ${DATABASE_USERNAME:wastecollect}
    password: ${DATABASE_PASSWORD:change-me-for-local-use}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
server:
  port: ${BACKEND_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173}
