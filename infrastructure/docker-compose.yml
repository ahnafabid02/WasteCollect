services:
  postgres:
    image: postgres:16-alpine
    container_name: wastecollect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wastecollect}
      POSTGRES_USER: ${POSTGRES_USER:-wastecollect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wastecollect-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wastecollect-postgres-data:
